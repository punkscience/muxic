name: APT Repository

on:
  # Fires when the Release workflow finishes. goreleaser publishes the
  # release with GITHUB_TOKEN, so the `release: published` event never
  # triggers downstream workflows — workflow_run is the signal that does.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Retained for manually-published GitHub releases (created by a user, not
  # GITHUB_TOKEN, so this path does fire) and as a re-run fallback.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  apt-repo:
    # Skip when the Release run failed; always run for manual/release paths.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up APT repo directories
        run: |
          mkdir -p apt/pool/main
          mkdir -p apt/dists/stable/main/binary-amd64
          mkdir -p apt/dists/stable/main/binary-arm64

      - name: Determine release tag
        id: tag
        run: |
          # workflow_run from a tag push exposes the tag as head_branch.
          if [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download .deb artifacts from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${RELEASE_TAG#v}"
          echo "Version: $VERSION"
          gh release download "$RELEASE_TAG" --pattern "muxic_${VERSION}_amd64.deb" --dir apt/pool/main --clobber
          gh release download "$RELEASE_TAG" --pattern "muxic_${VERSION}_arm64.deb" --dir apt/pool/main --clobber

      - name: Generate Packages files
        run: |
          cd apt
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 pool/ > dists/stable/main/binary-arm64/Packages
          # Strip non-standard Architecture-Variant field that confuses some apt versions
          sed -i '/^Architecture-Variant:/d' dists/stable/main/binary-amd64/Packages
          sed -i '/^Architecture-Variant:/d' dists/stable/main/binary-arm64/Packages
          gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
          gzip -9c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz

      - name: Generate Release file
        run: |
          set -e
          cd apt/dists/stable
          printf 'Origin: Punk Science Studios Inc\n' > Release
          printf 'Label: muxic\n' >> Release
          printf 'Suite: stable\n' >> Release
          printf 'Codename: stable\n' >> Release
          printf 'Architectures: amd64 arm64\n' >> Release
          printf 'Components: main\n' >> Release
          printf 'Description: APT repository for muxic - CLI music organizer\n' >> Release
          printf 'Date: %s\n' "$(date -u +"%a, %d %b %Y %H:%M:%S UTC")" >> Release
          printf 'MD5Sum:\n' >> Release
          find . -type f \( -name Packages -o -name Packages.gz \) | sort | while read f; do
            printf " %s %10s %s\n" "$(md5sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$(echo "$f" | sed 's|^\./||')"
          done >> Release
          printf 'SHA1:\n' >> Release
          find . -type f \( -name Packages -o -name Packages.gz \) | sort | while read f; do
            printf " %s %10s %s\n" "$(sha1sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$(echo "$f" | sed 's|^\./||')"
          done >> Release
          printf 'SHA256:\n' >> Release
          find . -type f \( -name Packages -o -name Packages.gz \) | sort | while read f; do
            printf " %s %10s %s\n" "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$(echo "$f" | sed 's|^\./||')"
          done >> Release
          printf 'SHA512:\n' >> Release
          find . -type f \( -name Packages -o -name Packages.gz \) | sort | while read f; do
            printf " %s %10s %s\n" "$(sha512sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$(echo "$f" | sed 's|^\./||')"
          done >> Release

      - name: Sign Release file with GPG
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -e

          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::APT_SIGNING_KEY secret is not set."
            echo "Generate a signing key and add it as the APT_SIGNING_KEY repository secret."
            exit 1
          fi

          echo "==> Importing APT_SIGNING_KEY from secrets"
          echo "$APT_SIGNING_KEY" | gpg --batch --import

          mkdir -p apt
          gpg --export muxic-packaging@punkscience.ca > apt/muxic-archive-keyring.gpg

          cd apt/dists/stable
          gpg --batch --yes --default-key muxic-packaging@punkscience.ca --clearsign -o InRelease Release
          gpg --batch --yes --default-key muxic-packaging@punkscience.ca --detach-sign -o Release.gpg Release

      - name: Copy install.sh to gh-pages root
        run: |
          curl -fsSL https://raw.githubusercontent.com/punkscience/muxic/main/install.sh -o install.sh
          chmod +x install.sh

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apt/ install.sh
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "apt: add muxic ${{ steps.tag.outputs.tag }} packages + install.sh"
            git push origin gh-pages
          fi
